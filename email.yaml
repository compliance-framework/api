enabled: true
provider: "smtp"
providers:
  smtp:
    name: SMTP
    provider: "smtp"
    enabled: true
    host: "localhost"
    port: 2525
    username: "testuser"
    password: "testpass"
    from: "noreply@compliance-framework.local"
    from_name: "Compliance Framework"
    use_ssl: false
    use_tls: false

  # AWS SES Configuration
  ses:
    name: "AWS SES"
    enabled: false
    region: "us-east-1"
    access_key_id: "your-access-key"
    secret_access_key: "your-secret-key"
    from: "noreply@compliance-framework.local"
    from_name: "Compliance Framework"

