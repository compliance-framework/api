  suggestions.DashboardSuggestion:
    properties:
      acceptedFilterId:
        type: string
      addedByUser:
        description: AddedByUser marks rows created during a group edit (no AI baseline).
        type: boolean
      confidence:
        type: number
      controlCatalogId:
        type: string
