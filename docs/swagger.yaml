  /lineage/nodes/{key}/ssps:
    get:
      description: 'Returns, for a control node, one row per System Security Plan:
        whether the control is in that plan''s profile and its rolled-up posture,
        evidence status and declared implementation status there. Powers the drawer''s
        plan-by-plan table. Only control keys (control:<catalogId>/<controlId>) are
        supported; other node kinds return 400.'
      parameters:
      - description: URL-encoded control node key
        in: path
        name: key
        required: true
        type: string
