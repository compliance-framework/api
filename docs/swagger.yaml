  /lineage/nodes/{key}/children:
    get:
      description: Returns one level of children for a node. Key is a composite like
        catalog:<uuid>, group:<catalogId>/<groupId>, control:<catalogId>/<controlId>,
        linkcat:<childCatalogId>/<relationship>/<parentCatalogId>/<parentControlId>,
        risk:<riskId>, evidence:<streamUuid>. A control expands to synthetic linkcat
        catalog nodes (its implementing/documenting controls grouped by their catalog)
        plus its directly-linked risks; a linkcat node expands to that group's controls;
        a risk expands to its latest evidence per linked stream; evidence is a leaf.
      parameters:
