# Shared go-service CI from compliance-framework/workflows, pinned to a release commit that
# ccf-bump moves. The status checks to require are `ci / required` and
# `release-checks / release-checks` (skipped, so passing, on non-release PRs).
name: ci

on:
  pull_request:
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-go-service.yml@899dbe5d7dac02de5fd60a92d764b189259e03dd # v1.5.0
    with:
      # Regenerate the Swagger docs (docs/) from the handler annotations before vet, the tests
      # and the make targets, as the old CI did before its tests.
      prepare-command: make swag
      # test-integration starts postgres through testcontainers (Docker is on the runner);
      # check-diff reruns swag and fails when the tree is dirty (stale committed docs).
      make-targets: test-integration check-diff
      # api's lint has needed up to 30 minutes (the old CI ran it with --timeout=30m).
      lint-timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@899dbe5d7dac02de5fd60a92d764b189259e03dd # v1.5.0
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@899dbe5d7dac02de5fd60a92d764b189259e03dd # v1.5.0
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
