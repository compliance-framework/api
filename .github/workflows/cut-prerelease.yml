# Cuts the next release candidate (vX.Y.Z-rcN) of the version the open release-please PR
# proposes, as ccf-release-bot; release.yml then publishes :X.Y.Z-rcN. Run it by hand.
name: cut-prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cut:
    uses: compliance-framework/workflows/.github/workflows/cut-prerelease.yml@1e188815a0e8036da1bea4e637a9973ecdc3ae1c # v1.9.0
    permissions:
      contents: read
    secrets: inherit
