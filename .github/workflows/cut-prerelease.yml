# Cuts the next release candidate (vX.Y.Z-rcN) of the version the open release-please PR
# proposes, as ccf-release-bot; release.yml then publishes :X.Y.Z-rcN. Run it by hand.
name: cut-prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cut:
    uses: compliance-framework/workflows/.github/workflows/cut-prerelease.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    permissions:
      contents: read
    secrets: inherit
