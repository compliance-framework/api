# Publishes ghcr.io/compliance-framework/api when a release is published: for vX.Y.Z the tags
# X.Y.Z, X.Y, X and latest; for an rc (vX.Y.Z-rcN, from cut-prerelease) only X.Y.Z-rcN.
# Built for linux/amd64 and linux/arm64 with the build arg VERSION=X.Y.Z[-rcN].
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-image.yml@1e188815a0e8036da1bea4e637a9973ecdc3ae1c # v1.9.0
    with:
      images: '[{"name":"api","dockerfile":"Dockerfile","context":"."}]'
    permissions:
      contents: read
      packages: write
    secrets: inherit
