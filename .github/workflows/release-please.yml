# Opens and updates the release PR from the conventional commits on main, and creates the
# vX.Y.Z tag and GitHub release when that PR merges, as ccf-release-bot. The config is
# release-please-config.json (the shared defaults) and .release-please-manifest.json.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    permissions:
      contents: read
    secrets: inherit
