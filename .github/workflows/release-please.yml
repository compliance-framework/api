# Opens and updates the release PR from the conventional commits on main, and creates the
# vX.Y.Z tag and GitHub release when that PR merges, as ccf-release-bot. The config is
# release-please-config.json (the shared defaults) and .release-please-manifest.json.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@1e188815a0e8036da1bea4e637a9973ecdc3ae1c # v1.9.0
    permissions:
      contents: read
    secrets: inherit
