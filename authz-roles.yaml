# CCF AuthZ — static role assignments for the embedded Cedar engine (local-dev).
#
# Consumed ONLY when the authz engine is "cedar" (CCF_AUTHZ_DRIVER=cedar in ../.env).
# The default "builtin" engine ignores this file entirely, so it is safe to leave
# mounted at all times and just flip the driver to switch behaviour.
#
# Cedar is DENY-BY-DEFAULT: a subject with no assignment here (directly or via a
# group) is denied every request. Roles must be one of the bundled roles declared in
# the manifest (internal/authz/manifest.yaml):
#
#   admin        full access ("*": ["*"])
#   contributor  author OSCAL/registers/workflows/dashboards/evidence; no admin
#   auditor      read everything + record evidence and maintain the risk/poam register
#   viewer       read-only
#   agent        service accounts: ingest evidence/heartbeats, register
#
# Matching is case-insensitive. `users` keys are the login email (the subject id) and
# work for every user today. `groups` keys are resolved group names (native CCF groups
# unioned with SSO/IdP groups) and take effect once the subject carries groups.

# ── Per-user grants (email → role) ───────────────────────────────────────────────
users:
  # Primary local-dev account, seeded by `make`/scripts/create-user.sh
  # (admin@example.com / password). KEEP THIS AS admin — without it you lock yourself
  # out of local-dev the moment you switch to the cedar engine.
  admin@example.com: admin

  # Dex/LDAP demo users (compose/dex/ldap/bootstrap.ldif). Pick contrasting roles so
  # the engine is easy to validate from the UI / GET /api/me/permissions.
  alice@example.com: admin        # Alice Admin — member of ccf-admins
  bob@example.com: viewer    # Bob User   — member of ccf-users
  # eve@example.com is intentionally left unassigned → denied. (Dex also blocks her
  # login via required_login_groups, but any unlisted user is denied regardless: this
  # is what deny-by-default looks like.)

# ── Per-group grants (group name → role) ─────────────────────────────────────────
# Granting by group is the recommended GitOps pattern. These become effective once the
# subject's groups are resolved (native CCF groups ∪ SSO groups). The dex demo surfaces
# the LDAP posix groups ccf-admins / ccf-users.
groups:
  ccf-admins: admin
  ccf-authorized-users: contributor
  ccf-users: contributor

# ── Agent default ────────────────────────────────────────────────────────────────
# Role granted to every authenticated agent. `agent` (the default) lets agents ingest
# evidence/heartbeats and register with zero further config.
agents: agent

# ── Anonymous (unauthenticated) grant ────────────────────────────────────────────
# Role granted to unauthenticated requests. OMIT or leave blank to keep the
# deny-by-default behaviour (recommended). Set to `viewer` only when you want read
# routes to be open without a login — e.g. a public-read demo deployment.
#   anonymous: viewer
